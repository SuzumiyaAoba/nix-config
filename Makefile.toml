[tasks.fmt]
description = "Run formatter"
command = "nix"
args = ["fmt"]

[tasks.check]
description = "Evaluate and build both darwin configurations"
command = "nix"
args = ["flake", "check"]

[tasks.update]
script = '''
  nix flake update
  '''

# Homebrew taps churn constantly; update them separately from nixpkgs et al.
[tasks.update-taps]
script = '''
  nix flake lock --update-input homebrew-core --update-input homebrew-cask --update-input aerospace-tap --update-input steipete-tap
  '''

[tasks."aarch64-darwin:desktop"]
script = '''
  sudo darwin-rebuild switch --flake .#desktop --override-input user-config path:./user.nix
'''

[tasks."aarch64-darwin:work"]
script = '''
  sudo darwin-rebuild switch --flake .#work --override-input user-config path:./user.nix
'''

[tasks.gc]
script = '''
  sudo nix-collect-garbage -d
'''
